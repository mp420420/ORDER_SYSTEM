<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上點餐系統 | 甘丹・50嵐・鮮茶道</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gandan: { 700: '#1b4332', 800: '#081c15' },
            fifty: { 600: '#2563eb', 700: '#1d4ed8' },
            preso: { 600: '#0f766e', 700: '#115e59' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased pb-24 lg:pb-6">

  <!-- 頂部導航 (三店家切換 + 點餐 / 訂單 / 後台 三分頁) -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-6xl mx-auto px-3.5 sm:px-4 h-16 flex items-center justify-between gap-2">
      
      <!-- 店家快速切換 Tab (極速切換模式) -->
      <div class="flex items-center space-x-1 sm:space-x-1.5 bg-slate-100 p-1 rounded-2xl border border-slate-200 overflow-x-auto hide-scrollbar">
        <button onclick="switchStore('甘丹茶飲')" id="btn-store-gandan" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> 甘丹茶飲
        </button>
        <button onclick="switchStore('50嵐')" id="btn-store-50lan" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span> 50嵐
        </button>
        <button onclick="switchStore('鮮茶道')" id="btn-store-preso" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-teal-400"></span> 鮮茶道
        </button>
      </div>

      <!-- 狀態顯示與【點餐 / 訂單 / 後台】三分頁切換 -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <span id="room-badge" class="hidden md:inline-block text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold whitespace-nowrap">點餐中 🟢</span>
        <div class="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200 text-xs font-bold flex-shrink-0">
          <button onclick="switchView('user')" id="btn-tab-user" class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-white shadow-xs text-slate-900 transition flex items-center gap-1">
            <i class="fa-solid fa-mug-saucer text-sm text-emerald-700"></i> <span>點餐</span>
          </button>
          <button onclick="switchView('orders')" id="btn-tab-orders" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
            <i class="fa-solid fa-list-check text-sm text-blue-600"></i> <span>訂單</span>
          </button>
          <button onclick="switchView('admin')" id="btn-tab-admin" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
            <i class="fa-solid fa-gear text-sm text-amber-600"></i> <span>後台</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-6xl mx-auto px-3.5 sm:px-4 py-4 sm:py-6 flex-1 w-full">

    <!-- ==================== 1. 同事點餐介面 (前台) ==================== -->
    <section id="view-user" class="block">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6">
        <div class="lg:col-span-8 space-y-4">
          <div id="store-banner" class="rounded-2xl p-3.5 sm:p-4 text-white shadow-xs transition-colors">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <h2 id="store-banner-title" class="text-base sm:text-lg font-black truncate flex items-center gap-1.5">
                  <span>🌿</span> 甘丹簡單 輕茶飲
                </h2>
                <p id="store-banner-sub" class="text-white/85 text-xs sm:text-sm mt-0.5 truncate">
                  即時同步至試算表【甘丹茶飲】分頁
                </p>
              </div>
              <div class="flex-shrink-0">
                <span id="store-badge" class="font-bold text-xs bg-black/25 px-2.5 py-1 rounded-xl text-white/95 whitespace-nowrap shadow-xs inline-block">
                  甘丹茶飲
                </span>
              </div>
            </div>
          </div>

          <div class="relative">
            <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar"></div>
          </div>

          <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4"></div>
        </div>

        <!-- 購物車 -->
        <div class="lg:col-span-4 mt-2 lg:mt-0" id="cart-section">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs sticky top-20 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-basket-shopping text-amber-600"></i> 您的點餐清單
              </h3>
              <button onclick="clearCart()" class="text-xs text-slate-400 hover:text-red-500 transition">清空</button>
            </div>

            <!-- 姓名/分機 -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">姓名 / 分機 <span class="text-red-500">*</span></label>
              <p class="text-xs text-slate-500 mb-1.5">請填「2 個中文字」或「4 位數分機」，方便主揪核對</p>
              <input type="text" id="user-name" placeholder="例如：大華　或　3051" class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-slate-50 focus:bg-white">
            </div>

            <!-- 4位數點餐密碼 -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">防誤刪密碼 (自訂4個數字) <span class="text-red-500">*</span></label>
              <input type="tel" id="user-pin" maxlength="4" placeholder="例如：1234 (刪除時需輸入)" class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700 bg-slate-50 focus:bg-white tracking-widest font-mono">
            </div>

            <div id="cart-items-list" class="divide-y divide-slate-100 max-h-48 overflow-y-auto pr-1">
              <p class="text-slate-400 text-xs text-center py-6">購物車目前是空的，快去點杯茶吧！</p>
            </div>

            <div class="border-t border-slate-100 pt-3 space-y-2.5">
              <div class="flex justify-between items-center text-base font-bold text-slate-900">
                <span>合計金額</span>
                <span id="cart-total-price" class="text-2xl font-black text-amber-600">$0</span>
              </div>
              <button id="btn-submit-order" onclick="submitOrder()" class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 active:scale-98 text-white font-bold text-base rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-regular fa-paper-plane"></i> 送出點餐 (即時同步)
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== 2. 訂單清單介面 (訂單明細頁面) ==================== -->
    <section id="view-orders" class="hidden space-y-4 sm:space-y-6">
      
      <!-- 統計快覽與操作列 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div>
          <span class="text-xs text-slate-500 font-bold block" id="orders-store-badge">甘丹茶飲 點餐名單</span>
          <div class="flex items-baseline gap-3 mt-1">
            <span class="text-2xl font-black text-amber-600" id="orders-total-amount">$0</span>
            <span class="text-sm font-bold text-slate-700" id="orders-total-count">0人 / 0杯</span>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
          <button onclick="fetchCloudOrders(true)" class="flex-1 sm:flex-none px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-xs transition">
            <i class="fa-solid fa-rotate"></i> 重新整理
          </button>
        </div>
      </div>

      <!-- 各員點餐與收款明細 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs space-y-3">
        <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-receipt text-amber-600"></i> 各員點餐與收款明細
        </h4>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-500 border-b border-slate-100">
                <th class="p-2.5 whitespace-nowrap">姓名</th>
                <th class="p-2.5">品項與規格</th>
                <th class="p-2.5 text-right whitespace-nowrap">金額</th>
                <th class="p-2.5 text-center whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody id="orders-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ==================== 3. 主揪管理介面 (後台：店家叫餐加總與管理功能) ==================== -->
    <section id="view-admin" class="hidden space-y-4 sm:space-y-6">
      
      <!-- 統計數據卡片 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-medium" id="stat-title-amount">甘丹茶飲 總金額</p>
            <h3 id="stat-total-amount" class="text-xl sm:text-2xl font-black text-slate-900 mt-0.5">$0</h3>
          </div>
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-coins"></i>
          </div>
        </div>

        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-medium" id="stat-title-count">點餐人數 / 杯數</p>
            <h3 id="stat-total-count" class="text-xl sm:text-2xl font-black text-slate-900 mt-0.5">0人/0杯</h3>
          </div>
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-users"></i>
          </div>
        </div>

        <div class="col-span-2 sm:col-span-1 bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-medium">點餐狀態控制</p>
            <div class="flex items-center gap-2 mt-1">
              <button type="button" onclick="toggleRoomStatus()" id="btn-toggle-room" class="px-3.5 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold transition shadow-xs">
                點餐開放中 🟢
              </button>
            </div>
          </div>
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center text-lg sm:text-xl">
            <i class="fa-solid fa-clock"></i>
          </div>
        </div>
      </div>

      <!-- 後台操作按鈕列 -->
      <div class="flex flex-wrap gap-2 justify-end">
        <button onclick="copyStoreSummary()" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-xs transition">
          <i class="fa-regular fa-copy"></i> 複製叫餐清單
        </button>
        <button onclick="exportCSV()" class="flex-1 sm:flex-none px-4 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-xs transition">
          <i class="fa-solid fa-file-excel"></i> 匯出 Excel
        </button>
        <button onclick="clearCloudOrders()" class="w-full sm:w-auto px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-xs transition">
          <i class="fa-solid fa-trash-can"></i> 清除此店家訂單 (開新團)
        </button>
      </div>

      <!-- 店家叫餐加總 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
        <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-store text-emerald-700"></i> 店家叫餐加總 (<span id="summary-store-name">甘丹茶飲</span>)
        </h4>
        <div id="aggregated-summary-list" class="divide-y divide-slate-100 text-xs sm:text-sm max-h-96 overflow-y-auto pr-1"></div>
      </div>

    </section>

  </main>

  <!-- 手機端底部浮動購物車 -->
  <div id="mobile-cart-float" class="lg:hidden fixed bottom-4 left-4 right-4 z-40 hidden">
    <button onclick="scrollToCart()" class="w-full bg-slate-900 text-white rounded-2xl p-3.5 shadow-2xl flex items-center justify-between active:scale-98 transition border border-slate-700">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-amber-600 rounded-xl flex items-center justify-center font-bold text-sm" id="mobile-cart-count">0</div>
        <span class="text-sm font-bold">查看訂單 / 填寫姓名</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="mobile-cart-price" class="text-base font-black text-amber-400">$0</span>
        <i class="fa-solid fa-chevron-up text-xs text-slate-400"></i>
      </div>
    </button>
  </div>

  <!-- 規格選擇彈跳視窗 -->
  <div id="modal-option" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh] sm:max-h-[90vh]">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 flex-shrink-0">
        <div class="flex items-center space-x-3">
          <span id="modal-item-icon" class="text-3xl">🍵</span>
          <div>
            <h3 id="modal-item-name" class="font-bold text-base sm:text-lg text-slate-900">飲品名稱</h3>
            <p id="modal-item-baseprice" class="text-sm text-emerald-800 font-bold">$35 起</p>
          </div>
        </div>
        <button onclick="closeOptionModal()" class="w-9 h-9 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-600 font-bold text-base">✕</button>
      </div>

      <div id="modal-options-body" class="p-4 sm:p-5 overflow-y-auto space-y-5 flex-1"></div>

      <div class="p-4 border-t border-slate-100 bg-white flex items-center justify-between flex-shrink-0">
        <div>
          <span class="text-xs text-slate-400 block font-medium">小計金額</span>
          <span id="modal-calculated-price" class="text-2xl font-black text-amber-600">$0</span>
        </div>
        <button onclick="confirmAddToCart()" class="px-6 py-3.5 bg-amber-600 hover:bg-amber-700 active:scale-98 text-white font-bold text-sm sm:text-base rounded-xl shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-cart-plus"></i> 加入購物清單
        </button>
      </div>
    </div>
  </div>

  <!-- 核心 Javascript (已全面快取化與加速) -->

    let currentStore = '甘丹茶飲';

      if (currentStore === storeName) return;

      if (cart.length > 0) {

        if (!ok) return;
        cart = [];
        renderCart();
      }

      initStoreData(storeName);

      const container = document.getElementById('category-tabs');
      let activeColorClass = 'bg-[#1b4332] text-white shadow-xs';

      if (currentStore === '鮮茶道') activeColorClass = 'bg-teal-700 text-white shadow-xs';
      
      container.innerHTML = orderedCategories.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition flex-shrink-0 ${selectedCategory === cat ? activeColorClass : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'}">

        </button>
      `).join('');

      selectedCategory = cat;
      renderCategoryTabs();

    function renderProductGrid() {
      const grid = document.getElementById('product-grid');
      const filtered = selectedCategory === '全部' ? products : products.filter(p => p.cat === selectedCategory);

      if (currentStore === '鮮茶道') btnBgClass = 'bg-teal-700 active:bg-teal-900';

      grid.innerHTML = filtered.map(p => {
        let priceTag = '';
        if (p.m && p.l) {
          priceTag = `中$${p.m} / 大$${p.l}`;
        } else if (p.l && p.xl) {
          priceTag = `大$${p.l} / 瓶$${p.xl}`;
        } else if (p.l) {
          priceTag = `大杯 $${p.l}`;
        } else if (p.m) {
          priceTag = `中杯 $${p.m}`;

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-3.5 shadow-xs hover:border-emerald-600 transition flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3.5 min-w-0">

        `;
      } else {
        html += `<p class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-xl">⚠️ 菜單規定：瓶裝規格不提供加料服務。</p>`;
      }

      container.innerHTML = html;
    }

    function selectModalSize(name, price) {
      currentModalSelections.size = { name, price };
      if (name.includes('生活瓶') || name.includes('瓶')) currentModalSelections.toppings = [];
      renderModalOptions();
      updateModalPrice();
    }

    function selectModalSweetness(name) {
      currentModalSelections.sweetness = { name, price: 0 };
      renderModalOptions();
    }

    function selectModalIce(name) {
      currentModalSelections.ice = { name, price: 0 };
      renderModalOptions();
    }

    function toggleModalHeavyMilk() {
      if (currentModalSelections.heavyMilk) {
        currentModalSelections.heavyMilk = null;
      } else {
        currentModalSelections.heavyMilk = { name: '升級重乳', price: 5 };
      }
      renderModalOptions();
      updateModalPrice();
    }

    function toggleModalTopping(name, price) {
      const idx = currentModalSelections.toppings.findIndex(t => t.name === name);
      if (idx > -1) {
        currentModalSelections.toppings.splice(idx, 1);
      } else {
        currentModalSelections.toppings.push({ name, price });
      }
      renderModalOptions();
      updateModalPrice();
    }

    function updateModalPrice() {
      if (!currentModalSelections.size) {
        document.getElementById('modal-calculated-price').innerText = `請選規格`;
        return;
      }
      let total = currentModalSelections.size.price;
      if (currentModalSelections.heavyMilk) total += currentModalSelections.heavyMilk.price;
      currentModalSelections.toppings.forEach(t => total += t.price);
      document.getElementById('modal-calculated-price').innerText = `$${total}`;
    }

    function confirmAddToCart() {
      if (!currentModalSelections.size) {
        alert('⚠️ 請選擇【容量規格】！');
        return;
      }
      if (!currentModalSelections.sweetness) {
        alert('⚠️ 請選擇【甜度】！');
        return;
      }
      if (!currentModalSelections.ice) {
        alert('⚠️ 請選擇【冰塊溫度】！');
        return;
      }

      let specs = [];
      specs.push(currentModalSelections.size.name);
      specs.push(currentModalSelections.sweetness.name);
      specs.push(currentModalSelections.ice.name);
      if (currentModalSelections.heavyMilk) specs.push('升級重乳(+5)');
      currentModalSelections.toppings.forEach(t => {
        specs.push(t.price > 0 ? `${t.name}(+${t.price})` : t.name);
      });

      let total = currentModalSelections.size.price;
      if (currentModalSelections.heavyMilk) total += currentModalSelections.heavyMilk.price;
      currentModalSelections.toppings.forEach(t => total += t.price);

      cart.push({
        store: currentStore,
        name: `【${currentStore}】` + currentModalProduct.name,
        rawName: currentModalProduct.name,
        specs: specs.join(', '),
        price: total
      });

      renderCart();
      closeOptionModal();
    }

    function renderCart() {
      const container = document.getElementById('cart-items-list');
      const totalDisplay = document.getElementById('cart-total-price');
      const floatBar = document.getElementById('mobile-cart-float');
      const mobileCount = document.getElementById('mobile-cart-count');
      const mobilePrice = document.getElementById('mobile-cart-price');

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs text-center py-6">購物車目前是空的，快去點杯茶吧！</p>`;
        totalDisplay.innerText = '$0';
        floatBar.classList.add('hidden');
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, index) => {
        total += item.price;
        return `
          <div class="py-2.5 flex justify-between items-start">
            <div class="space-y-0.5 min-w-0 pr-2">
              <h4 class="text-sm font-bold text-slate-800 truncate">${item.name}</h4>
              <p class="text-xs text-slate-500">${item.specs}</p>
            </div>
            <div class="text-right flex items-center space-x-2 flex-shrink-0">
              <span class="text-sm font-black text-slate-900">$${item.price}</span>
              <button onclick="removeCartItem(${index})" class="text-slate-300 hover:text-red-500 text-sm p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');

      totalDisplay.innerText = `$${total}`;
      mobileCount.innerText = cart.length;
      mobilePrice.innerText = `$${total}`;
      floatBar.classList.remove('hidden');
    }

    function removeCartItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function scrollToCart() {
      const cartEl = document.getElementById('cart-section');
      cartEl.scrollIntoView({ behavior: 'smooth' });
      document.getElementById('user-name').focus();
    }

    // 點餐送出
    async function submitOrder() {
      if (!isRoomOpen) {
        alert('抱歉，今日點餐已經截止！');
        return;
      }
      const userName = document.getElementById('user-name').value.trim();
      if (!userName) {
        alert('請輸入您的姓名或分機！');
        document.getElementById('user-name').focus();
        return;
      }

      const userPin = document.getElementById('user-pin').value.trim();
      if (!userPin || userPin.length !== 4 || isNaN(userPin)) {
        alert('⚠️ 請輸入 4 位純數字作為防誤刪密碼！(例如：1234)');
        document.getElementById('user-pin').focus();
        return;
      }

      if (cart.length === 0) {
        alert('購物車目前是空的，請先挑選飲料！');
        return;
      }

      const btn = document.getElementById('btn-submit-order');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在同步至試算表...`;

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${year}/${month}/${date} ${hours}:${minutes}`;

      const payload = {
        store: currentStore,
        user: userName,
        pin: userPin,
        items: cart.map(item => ({
          name: item.rawName,
          specs: item.specs,
          price: item.price,
          time: timeStr
        }))
      };

      try {
        const result = await postToGas(payload);

        if (result.status !== 'success') {
          alert(`❌ 送出失敗：${result.message || result.status}\n\n請重試一次，若持續失敗請通知主揪。`);
          return;
        }

        alert(`🎉 點餐成功！已為 ${userName} 送出 ${result.added} 杯飲料至【${currentStore}】。\n\n📌 您的刪除密碼為：${userPin}（請牢記）`);
        clearCart();
        delete ordersCache[currentStore]; // 清除快取，下次查看自動抓最新
      } catch (err) {
        alert(`⚠️ 連線失敗，訂單「沒有」送出。\n\n請檢查網路後再試一次。`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-regular fa-paper-plane"></i> 送出點餐 (即時同步)`;
      }
    }

    // 統一的 POST 送出：用 text/plain 避開瀏覽器 preflight，
    // 這樣 GAS 才回得了內容，前端也才能真正判斷成功或失敗。
    async function postToGas(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    // 抓取雲端訂單 (支援背景更新與強制重整)
    async function fetchCloudOrders(forceRefresh = false) {
      if (!forceRefresh && ordersCache[currentStore]) {
        orders = ordersCache[currentStore];
        renderAdminStats();
        renderAdminOrders();
      }

      try {
        const res = await fetch(`${GAS_API_URL}?store=${encodeURIComponent(currentStore)}`);
        const data = await res.json();
        orders = data;
        ordersCache[currentStore] = data; // 存入本機快取
        renderAdminStats();
        renderAdminOrders();
      } catch (e) {
        console.log('載入雲端訂單中');
      }
    }

    // 刪除單筆訂單
    async function deleteSingleOrder(rowIndex, userName, itemName) {
      const inputPin = prompt(`🔐 安全防護：欲刪除【${userName} - ${itemName}】\n\n請輸入點餐時設定的 4 位數密碼（主揪萬能密碼為 9999）：`);
      if (inputPin === null) return;

      if (!inputPin.trim()) {
        alert('⚠️ 密碼不可為空！');
        return;
      }

      try {
        // 一併送出姓名與品項，讓後端比對，避免清單變動後刪到別人的飲料
        const result = await postToGas({
          action: 'delete_single',
          store: currentStore,
          rowIndex: rowIndex,
          user: userName,
          item: itemName,
          pin: inputPin.trim()
        });

        if (result.status === 'wrong_password') {
          alert('❌ 密碼錯誤！無法刪除該筆訂單。');
          return;
        }
        if (result.status === 'stale') {
          alert(`⚠️ ${result.message || '清單已變動'}\n\n已為您重新整理，請再試一次。`);
          fetchCloudOrders(true);
          return;
        }
        if (result.status !== 'deleted') {
          alert(`❌ 刪除失敗：${result.message || result.status}`);
          fetchCloudOrders(true);
          return;
        }

        alert(`✅ 已刪除【${userName} - ${itemName}】！`);
        fetchCloudOrders(true);
      } catch (err) {
        alert(`⚠️ 連線失敗，未能刪除。\n\n已重新整理清單，請確認後再試一次。`);
        fetchCloudOrders(true);
      }
    }

    async function clearCloudOrders() {
      if (orders.length === 0) {
        alert(`目前【${currentStore}】分頁本來就沒有任何訂單紀錄喔！`);
        return;
      }
      
      const confirmClear = confirm(`⚠️ 確定要清除【${currentStore}】的全部 ${orders.length} 筆訂單嗎？\n\n此動作只會清空試算表中【${currentStore}】分頁的紀錄，其他店家不受影響。\n\n‼️ 清除後無法復原。`);
      if (!confirmClear) return;

      const masterPin = prompt('🔐 清空全店訂單需要主揪密碼，請輸入：');
      if (masterPin === null) return;

      try {
        const result = await postToGas({
          action: 'clear',
          store: currentStore,
          pin: String(masterPin).trim()
        });

        if (result.status === 'wrong_password') {
          alert('❌ 主揪密碼錯誤，未清除任何資料。');
          return;
        }
        if (result.status !== 'cleared') {
          alert(`❌ 清除失敗：${result.message || result.status}`);
          return;
        }

        alert(`✅ 已清空【${currentStore}】分頁，共移除 ${result.removed} 筆訂單。`);
        orders = [];
        ordersCache[currentStore] = [];
        renderAdminStats();
        renderAdminOrders();
      } catch (err) {
        alert(`⚠️ 連線失敗，未能清除。請重試。`);
      }
    }

    function renderAdminStats() {
      const totalAmount = orders.reduce((sum, o) => sum + Number(o.price || 0), 0);
      const uniqueUsers = new Set(orders.map(o => o.user)).size;
      
      document.getElementById('stat-total-amount').innerText = `$${totalAmount}`;
      document.getElementById('stat-total-count').innerText = `${uniqueUsers}人 / ${orders.length}杯`;

      document.getElementById('orders-total-amount').innerText = `$${totalAmount}`;
      document.getElementById('orders-total-count').innerText = `${uniqueUsers}人 / ${orders.length}杯`;
    }

    function renderAdminOrders() {
      const aggregatedContainer = document.getElementById('aggregated-summary-list');
      const itemMap = {};

      orders.forEach(o => {
        const key = `${o.item} 【${o.specs}】`;
        itemMap[key] = (itemMap[key] || 0) + 1;
      });

      if (Object.keys(itemMap).length === 0) {
        aggregatedContainer.innerHTML = `<p class="text-slate-400 text-xs py-4 text-center">【${currentStore}】目前尚無訂單紀錄</p>`;
      } else {
        aggregatedContainer.innerHTML = Object.entries(itemMap).map(([spec, count]) => `
          <div class="py-2.5 flex justify-between items-center text-sm">
            <span class="text-slate-700 pr-2">${spec}</span>
            <span class="font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg">x ${count}</span>
          </div>
        `).join('');
      }

      const tableBody = document.getElementById('orders-table-body');
      if (orders.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">目前【${currentStore}】分頁中尚無訂單</td></tr>`;
      } else {
        tableBody.innerHTML = orders.map(o => `
          <tr class="hover:bg-slate-50 transition text-sm">
            <td class="p-2.5 font-bold text-slate-900 whitespace-nowrap">${o.user} <span class="text-xs font-normal text-slate-400 block">${o.time}</span></td>
            <td class="p-2.5 text-slate-700">${o.item} <span class="text-slate-400 text-xs block">${o.specs}</span></td>
            <td class="p-2.5 text-right font-bold text-amber-600 whitespace-nowrap">$${o.price}</td>
            <td class="p-2.5 text-center whitespace-nowrap">
              <button onclick="deleteSingleOrder(${o.rowIndex}, '${o.user}', '${o.item}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold transition">
                刪除 ✕
              </button>
            </td>
          </tr>
        `).join('');
      }
    }

    function copyStoreSummary() {
      const itemMap = {};
      orders.forEach(o => {
        const key = `${o.item} (${o.specs})`;
        itemMap[key] = (itemMap[key] || 0) + 1;
      });

      let text = `📋 【${currentStore} - 訂單統計】\n總杯數：${orders.length} 杯 ｜ 總金額：$${orders.reduce((s,o)=>s+Number(o.price||0),0)} 元\n-------------------------\n`;
      Object.entries(itemMap).forEach(([name, count]) => {
        text += `• ${name} x ${count}\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        alert(`✅ 已複製【${currentStore}】叫餐清單至剪貼簿！`);
      });
    }

    function exportCSV() {
      if (orders.length === 0) {
        alert('目前無訂單可匯出！');
        return;
      }
      let csv = "\uFEFF姓名,餐點,規格,金額,時間,密碼\n";
      orders.forEach(o => {
        csv += `"${o.user}","${o.item}","${o.specs}",${o.price},"${o.time}","${o.pin}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${currentStore}_訂單統計_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function toggleRoomStatus() {
      isRoomOpen = !isRoomOpen;
      const badge = document.getElementById('room-badge');
      const btn = document.getElementById('btn-toggle-room');

      if (isRoomOpen) {
        badge.className = "hidden md:inline-block text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold whitespace-nowrap";
        badge.innerText = "點餐中 🟢";
        btn.className = "px-3.5 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold transition shadow-xs";
        btn.innerText = "點餐開放中 🟢";
      } else {
        badge.className = "hidden md:inline-block text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-medium whitespace-nowrap";
        badge.innerText = "已截止 🔴";
        btn.className = "px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-xs";
        btn.innerText = "已截止點餐 🔴";
      }
    }

    // 三分頁切換邏輯 (點餐 / 訂單 / 後台)
    function switchView(view) {
      currentViewMode = view;
      const userView = document.getElementById('view-user');
      const ordersView = document.getElementById('view-orders');
      const adminView = document.getElementById('view-admin');
      
      const btnUser = document.getElementById('btn-tab-user');
      const btnOrders = document.getElementById('btn-tab-orders');
      const btnAdmin = document.getElementById('btn-tab-admin');

      userView.classList.add('hidden');
      ordersView.classList.add('hidden');
      adminView.classList.add('hidden');

      btnUser.className = "px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition flex items-center gap-1";
      btnOrders.className = "px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition flex items-center gap-1";
      btnAdmin.className = "px-2.5 sm:px-3 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition flex items-center gap-1";

      if (view === 'user') {
        userView.classList.remove('hidden');
        btnUser.className = "px-2.5 sm:px-3 py-1.5 rounded-xl bg-white shadow-xs text-slate-900 transition flex items-center gap-1";
      } else if (view === 'orders') {
        ordersView.classList.remove('hidden');
        btnOrders.className = "px-2.5 sm:px-3 py-1.5 rounded-xl bg-white shadow-xs text-slate-900 transition flex items-center gap-1";
        fetchCloudOrders();
      } else if (view === 'admin') {
        adminView.classList.remove('hidden');
        btnAdmin.className = "px-2.5 sm:px-3 py-1.5 rounded-xl bg-white shadow-xs text-slate-900 transition flex items-center gap-1";
        fetchCloudOrders();
      }
    }
  </script>
</body>
</html>
